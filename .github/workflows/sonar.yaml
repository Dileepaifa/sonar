name: SonarQube V - Detailed Metric Segregation

on:
  push:
    branches: [ main, develop ]

jobs:
  analyze_and_archive:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: 3. Wait for Processing
        run: sleep 30

      - name: 4. Fetch Issues and Segregate by Severity
        run: |
          # Fetch all open issues for the project
          curl -u ${{ secrets.SONAR_TOKEN }}: \
          "${{ secrets.SONAR_HOST_URL }}/api/issues/search?componentKeys=nodejs-sample-project&resolved=false&ps=500" \
          -o detailed_issues.json

          # Use jq to map Sonar severities to your categories and count them per metric type
          jq -n \
            --arg project "AIFAPythonAI_ctg" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --argjson data "$(<detailed_issues.json)" \
            '{
              report_info: {
                project_name: $project,
                branch: $branch,
                commit: $commit,
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              },
              segregated_metrics: ($data.issues | group_by(.type) | map({
                type: .[0].type,
                basic: (map(select(.severity == "INFO" or .severity == "MINOR")) | length),
                intermediate: (map(select(.severity == "MAJOR")) | length),
                high: (map(select(.severity == "CRITICAL" or .severity == "BLOCKER")) | length),
                total: length
              }))
            }' > enriched-sonar-report.json

      - name: 5. Create Human-Readable Summary
        run: |
          echo "## 🛡️ Detailed Security & Quality Segregation" > summary.md
          echo "- **Project:** AIFAPythonAI_ctg" >> summary.md
          echo "- **Branch:** ${{ github.ref_name }}" >> summary.md
          echo "" >> summary.md
          echo "| Metric Type | Basic | Intermediate | High | **Total** |" >> summary.md
          echo "| :--- | :---: | :---: | :---: | :---: |" >> summary.md
          jq -r '.segregated_metrics[] | "| \(.type) | \(.basic) | \(.intermediate) | \(.high) | **\(.total)** |"' enriched-sonar-report.json >> summary.md

      - name: 6. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 7. Upload to S3
        run: |
          # Note: Ensure S3 IAM Policy has the /* suffix
          export BASE_PATH="s3://sonarqube-reports-aifa/reports/nodejs-sample-project/${{ github.ref_name }}/${{ github.sha }}"
          aws s3 cp enriched-sonar-report.json "${BASE_PATH}/report.json"
          aws s3 cp summary.md "${BASE_PATH}/summary.md"