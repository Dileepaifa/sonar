name: SonarQube V - Severity Classification Pipeline

on:
  push:
    branches: [ develop ]

jobs:
  analyze_and_archive:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: 3. Wait for Processing
        run: sleep 30

      - name: 4. Fetch, Enrich & Classify Severity
        run: |
          # Fetch raw metrics
          curl -u ${{ secrets.SONAR_TOKEN }}: \
          "${{ secrets.SONAR_HOST_URL }}/api/measures/component?component=nodejs-sample-project&metricKeys=bugs,vulnerabilities,code_smells,security_rating" \
          -o raw_metrics.json

          # Calculate Severity Level using jq
          # Logic: Total (Bugs + Vulnerabilities)
          jq -n \
            --arg project "NodeJS Sample Project" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --argjson sonar "$(<raw_metrics.json)" \
            '{
              report_info: {
                project_name: $project,
                branch: $branch,
                commit: $commit,
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              },
              metrics: ($sonar.component.measures | map({(.metric): (.value | tonumber)}) | add),
            }' | jq '
              .metrics.total_issues = (.metrics.bugs + .metrics.vulnerabilities) |
              .severity_level = (
                if .metrics.total_issues == 0 then "BASIC"
                elif .metrics.total_issues <= 5 then "INTERMEDIATE"
                else "HIGH"
                end
              )' > enriched-sonar-report.json

      - name: 5. Create Human-Readable Summary
        run: |
          # Use jq to extract the level we just calculated
          LEVEL=$(jq -r '.severity_level' enriched-sonar-report.json)
          
          echo "## 🛡️ Security Audit Report" > summary.md
          echo "### RISK LEVEL: **$LEVEL**" >> summary.md
          echo "- **Project:** NodeJS Sample Project" >> summary.md
          echo "- **Branch:** ${{ github.ref_name }}" >> summary.md
          echo "" >> summary.md
          echo "#### Detailed Metrics" >> summary.md
          echo "| Metric | Count |" >> summary.md
          echo "| :--- | :--- |" >> summary.md
          jq -r '.metrics | to_entries | .[] | "| \(.key) | \(.value) |"' enriched-sonar-report.json >> summary.md

      - name: 6. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 7. Upload to S3
        run: |
          # Note: Ensure S3 IAM Policy has the /* suffix to avoid AccessDenied
          export BASE_PATH="s3://sonarqube-reports-aifa/reports/nodejs-sample-project/${{ github.ref_name }}/${{ github.sha }}"
          aws s3 cp enriched-sonar-report.json "${BASE_PATH}/report.json"
          aws s3 cp summary.md "${BASE_PATH}/summary.md"